<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Quantum Ball Interactivity Harness</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #050607;
        --panel: rgba(15, 18, 23, 0.84);
        --line: rgba(255, 255, 255, 0.15);
        --text: #f6f7f4;
        --muted: #aeb8b5;
        --cyan: #39d8e8;
        --amber: #ffc64b;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        overflow: hidden;
        background: var(--bg);
        color: var(--text);
      }

      canvas {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
      }

      .panel {
        position: fixed;
        top: 16px;
        left: 16px;
        display: grid;
        width: min(320px, calc(100vw - 32px));
        gap: 10px;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 14px;
        background: var(--panel);
        backdrop-filter: blur(16px);
      }

      h1 {
        margin: 0;
        font-size: 1rem;
      }

      p,
      pre {
        margin: 0;
        color: var(--muted);
        font-size: 0.82rem;
        line-height: 1.45;
      }

      .buttons {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }

      button {
        min-height: 38px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.08);
        color: var(--text);
        font: inherit;
        cursor: pointer;
      }

      button:hover {
        border-color: rgba(57, 216, 232, 0.62);
      }

      pre {
        overflow: auto;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 9px;
        background: rgba(0, 0, 0, 0.24);
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <canvas id="canvas"></canvas>
    <section class="panel" aria-label="Interactivity harness">
      <h1>Quantum Ball Harness</h1>
      <p>Same glTF asset and runtime used by the game.</p>
      <div class="buttons">
        <button data-event="QB_SELECTED">Selected</button>
        <button data-event="QB_CHARGE">Charge</button>
        <button data-event="QB_RELEASED">Released</button>
        <button data-event="QB_COLLISION">Collision</button>
        <button data-event="QB_QUANTUM">Quantum</button>
        <button data-event="QB_COLLAPSE">Collapse</button>
        <button data-event="QB_POCKETED">Pocketed</button>
        <button data-event="QB_RESET">Reset</button>
      </div>
      <pre id="status">Loading</pre>
    </section>

    <script type="importmap">
      {
        "imports": {
          "three": "../vendor/three.module.min.js"
        }
      }
    </script>
    <script type="module">
      import * as THREE from "../vendor/three.module.min.js";
      import { InteractivityDiagnostics } from "../interactivity/diagnostics.js";
      import { QB_EVENTS } from "../interactivity/constants.js";
      import { createQuantumBallInstance } from "../interactivity/host-bindings.js";

      const canvas = document.querySelector("#canvas");
      const status = document.querySelector("#status");
      const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.setClearColor(0x050607, 1);

      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(52, 1, 0.01, 10);
      camera.position.set(0, 0.13, 0.42);
      camera.lookAt(0, 0, 0);
      scene.add(new THREE.HemisphereLight(0xbdf8ff, 0x180814, 2.1));
      const key = new THREE.PointLight(0xffc64b, 3.2, 3);
      key.position.set(0.2, 0.35, 0.28);
      scene.add(key);

      const diagnostics = new InteractivityDiagnostics();
      diagnostics.subscribe((snapshot) => {
        status.textContent = [snapshot.status, ...Object.entries(snapshot.variables).map(([k, v]) => `${k}: ${v}`)]
          .join("\n");
      });

      const instance = await createQuantumBallInstance({
        url: "../assets/interactive/quantum-ball.gltf",
        diagnostics,
        onAssetEvent: (id) => {
          diagnostics.info(`Harness received ${id}`);
        },
      });
      scene.add(instance.root);

      document.querySelector(".buttons").addEventListener("click", (event) => {
        const button = event.target.closest("button[data-event]");
        if (!button) return;
        const id = button.dataset.event;
        const payload = {};
        if (id === QB_EVENTS.charge || id === QB_EVENTS.released) payload.charge = 0.88;
        if (id === QB_EVENTS.collision || id === QB_EVENTS.quantum) payload.impact = 1.0;
        instance.send(id, payload);
      });

      function resize() {
        renderer.setSize(window.innerWidth, window.innerHeight, false);
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
      }

      function animate(time) {
        const seconds = time * 0.001;
        instance.update(seconds, { coherence: 0.82 });
        renderer.render(scene, camera);
      }

      window.addEventListener("resize", resize);
      resize();
      renderer.setAnimationLoop(animate);
    </script>
  </body>
</html>
